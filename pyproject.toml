[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-fruit-counting"
version = "0.1.0"
description = "Curated agricultural-vision research source with tested tracking primitives"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.8,<5", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
